name: Verify release gitlinks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out AIO history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Verify changed gitlinks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$HEAD_SHA")"
          fi

          verifier="$RUNNER_TEMP/verify_release_gitlinks.py"
          verifier_path=".agents/skills/yukon-auto-update-release/scripts/verify_release_gitlinks.py"
          if git cat-file -e "${base}:${verifier_path}" 2>/dev/null; then
            git show "${base}:${verifier_path}" > "$verifier"
          else
            cp "$verifier_path" "$verifier"
          fi

          python "$verifier" --aio-root . --base "$base" --head "$HEAD_SHA"
